<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/fragments :: head(#{reset.title})}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card fade-in">
        <div class="auth-logo"><span th:replace="~{layout/fragments :: logomark}"></span></div>
        <h2 th:text="#{reset.title}">Escribe el codigo</h2>
        <p class="auth-sub" th:text="#{reset.subtitle}">Revisa tu correo</p>

        <div class="alert alert-success" th:if="${successKey}" th:text="#{${successKey}}">OK</div>

        <form th:action="@{/auth/reset-password}" th:object="${resetPasswordForm}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Error</div>

            <input type="hidden" th:field="*{email}"/>
            <input type="hidden" th:field="*{token}"/>

            <div class="form-group">
                <label th:text="#{reset.code}">Codigo de 6 digitos</label>
                <input type="text" th:field="*{code}" class="form-control" inputmode="numeric"
                       maxlength="6" autocomplete="one-time-code" autofocus/>
                <div class="form-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
            </div>

            <div class="form-group">
                <label th:text="#{reset.password}">Contrasena nueva</label>
                <input type="password" th:field="*{password}" class="form-control"/>
                <small class="text-muted" style="font-size:.76rem" th:text="#{validation.password.weak}">Requisitos</small>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label th:text="#{reset.confirmPassword}">Confirmar contrasena</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control"/>
                <div class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <!-- Google reCAPTCHA: sin esto, el codigo de 6 digitos se podria intentar
                 adivinar por fuerza bruta de forma automatizada. -->
            <div class="form-group">
                <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" th:text="#{reset.submit}">Cambiar contrasena</button>
        </form>

        <p class="text-center mt-2"><a th:href="@{/auth/forgot-password}" th:text="#{reset.resend}">Pedir otro codigo</a></p>
    </div>
</div>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
