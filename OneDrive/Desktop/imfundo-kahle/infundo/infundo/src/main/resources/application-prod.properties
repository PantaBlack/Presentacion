# ============================================================
#  Perfil "prod": marcha blanca / despliegue real (Railway u otro host).
#  Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
#  NUNCA se activa solo: hay que definir tambien las variables de conexion
#  a Postgres (ver mas abajo) y las credenciales de ADMIN_PASSWORD/SEED_PASSWORD.
# ============================================================

# ------------------------------------------------------------
#  Base de datos: PostgreSQL real, no H2 en memoria.
# ------------------------------------------------------------
# En Railway: crea el plugin de Postgres y en las variables de ESTA app usa
# "reference variables" apuntando al plugin, por ejemplo:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://${{Postgres.PGHOST}}:${{Postgres.PGPORT}}/${{Postgres.PGDATABASE}}
#   SPRING_DATASOURCE_USERNAME=${{Postgres.PGUSER}}
#   SPRING_DATASOURCE_PASSWORD=${{Postgres.PGPASSWORD}}
# Spring Boot ya lee esas variables de entorno solo (SPRING_DATASOURCE_URL ->
# spring.datasource.url), por eso aqui solo hace falta declarar el driver.
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
#  JPA / Hibernate
# ------------------------------------------------------------
# Dialecto fijo (a diferencia del perfil por defecto): sin esto, Hibernate
# necesita conectarse a la base YA durante el arranque solo para detectar el
# dialecto por los metadatos JDBC. Si el contenedor de Postgres en Railway
# tarda un poco mas en estar listo que el de la app, el arranque falla por
# una carrera que no tiene nada que ver con el codigo. Fijandolo aqui, esa
# deteccion no depende de que la conexion ya este disponible en ese instante.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" en vez de "create-drop": nunca borra datos reales al reiniciar o
# redeployar. Es la opcion correcta para una marcha blanca; mas adelante, si
# el proyecto sigue, lo ideal es migrar a Flyway/Liquibase para cambios de
# esquema controlados en vez de dejar que Hibernate los infiera.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ------------------------------------------------------------
#  Datos de arranque (DataInitializer)
# ------------------------------------------------------------
# Sin usuarios de demostracion en la marcha blanca real: las cuentas se crean
# via /auth/register o las crea el admin, no con datos de ejemplo falsos.
# Se puede reactivar temporalmente con SEED_DEMO_USERS=true si se necesita.
app.seed.demo-users-enabled=${SEED_DEMO_USERS:false}
