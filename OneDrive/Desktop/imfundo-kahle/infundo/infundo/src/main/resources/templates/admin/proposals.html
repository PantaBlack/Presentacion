<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/fragments :: head(#{admin.proposals.title})}"></head>
<body>
<nav th:replace="~{layout/fragments :: appnav}"></nav>
<div class="app-shell">
    <aside th:replace="~{layout/fragments :: adminSidebar('proposals')}"></aside>
    <main class="content content--admin">
        <header class="page-head page-head--admin">
            <div class="page-head-copy">
                <span class="eyebrow">
                    <svg th:replace="~{layout/fragments :: icon('file','ico-sm')}"></svg>
                    <span th:text="#{admin.menu.proposals}">Propuestas</span>
                </span>
                <h1 th:text="#{admin.proposals.title}">Gestion de propuestas</h1>
                <p th:text="#{admin.proposals.subtitle}">Revisa las propuestas</p>
            </div>
        </header>

        <div th:replace="~{layout/fragments :: flash}"></div>

        <!-- Filtros -->
        <section class="panel">
        <div class="panel-body">
        <form method="get" class="flex gap wrap" style="align-items:flex-end">
            <div class="form-group" style="margin:0">
                <label th:text="#{common.status}">Estado</label>
                <select name="status" class="form-control">
                    <option value="" th:text="#{common.all}">Todos</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="#{'pstatus.' + ${s}}"
                            th:selected="${statusFilter == s.name()}">Estado</option>
                </select>
            </div>
            <div class="form-group" style="margin:0">
                <label th:text="#{common.type}">Tipo</label>
                <select name="type" class="form-control">
                    <option value="" th:text="#{common.all}">Todos</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="#{'ptype.' + ${t}}"
                            th:selected="${typeFilter == t.name()}">Tipo</option>
                </select>
            </div>
            <button class="btn btn-primary" th:text="#{common.filter}">Filtrar</button>
        </form>
        </div>
        </section>

        <section class="panel">
        <div class="panel-body panel-body--flush" style="overflow-x:auto">
        <table class="data" th:if="${!proposals.isEmpty()}">
            <thead><tr>
                <th th:text="#{common.title}">Titulo</th>
                <th th:text="#{common.teacher}">Profesor</th>
                <th th:text="#{common.type}">Tipo</th>
                <th th:text="#{common.status}">Estado</th>
                <th th:text="#{common.actions}">Acciones</th>
            </tr></thead>
            <tbody>
            <tr th:each="p : ${proposals}">
                <td>
                    <strong th:text="${p.title}">Titulo</strong>
                    <div class="text-muted" style="font-size:.82rem" th:text="${p.description}">Descripcion</div>
                    <div class="text-muted" style="font-size:.8rem" th:if="${p.adminComment}">
                        &#128172; <span th:text="${p.adminComment}">Comentario</span></div>
                </td>
                <td th:text="${p.teacher.fullName}">Profesor</td>
                <td th:text="#{'ptype.' + ${p.type}}">Tipo</td>
                <td>
                    <span class="badge" th:classappend="${p.status.name() == 'PENDING'} ? 'badge-pending' : (${p.status.name() == 'APPROVED'} ? 'badge-approved' : 'badge-rejected')"
                          th:text="#{'pstatus.' + ${p.status}}">Estado</span>
                </td>
                <td>
                    <button class="btn btn-primary btn-sm" th:if="${p.status.name() == 'PENDING'}"
                            th:attr="onclick=|openReview(${p.id}, '${p.title}')|" th:text="#{common.view}">Revisar</button>
                    <span class="text-muted" th:unless="${p.status.name() == 'PENDING'}">&#10003;</span>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="text-muted" th:if="${proposals.isEmpty()}" th:text="#{common.none}">Sin datos</p>
        </div>
        </section>
    </main>
</div>

<!-- Modal de revision -->
<div id="reviewModal" class="modal-overlay">
    <div class="card modal-card">
        <h3 th:text="#{admin.review.title}">Revisar propuesta</h3>
        <p class="text-muted" id="reviewTitle"></p>
        <form th:action="@{/admin/proposals/0/review}" method="post" id="reviewForm">
            <div class="form-group">
                <label th:text="#{common.comment}">Comentario</label>
                <textarea name="adminComment" class="form-control" rows="3" required></textarea>
            </div>
            <div class="flex gap">
                <button type="submit" name="decision" value="APPROVE" class="btn btn-success" th:text="#{common.approve}">Aprobar</button>
                <button type="submit" name="decision" value="REJECT" class="btn btn-danger" th:text="#{common.reject}">Rechazar</button>
                <button type="button" class="btn btn-outline" onclick="closeReview()" th:text="#{common.cancel}">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script th:inline="javascript">
    function openReview(id, title) {
        const modal = document.getElementById('reviewModal');
        const form = document.getElementById('reviewForm');
        form.action = '/admin/proposals/' + id + '/review';
        document.getElementById('reviewTitle').textContent = title;
        modal.classList.add('show');
    }
    function closeReview() { document.getElementById('reviewModal').classList.remove('show'); }
</script>
</body>
</html>
