<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/fragments :: head(#{forgot.title})}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card fade-in">
        <div class="auth-logo"><span th:replace="~{layout/fragments :: logomark}"></span></div>
        <h2 th:text="#{forgot.title}">Recuperar contrasena</h2>
        <p class="auth-sub" th:text="#{forgot.subtitle}">Te mandamos un codigo a tu correo</p>

        <form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordForm}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}">Error</div>

            <div class="form-group">
                <label th:text="#{forgot.email}">Correo</label>
                <input type="email" th:field="*{email}" class="form-control" autofocus/>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <!-- Google reCAPTCHA -->
            <div class="form-group">
                <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" th:text="#{forgot.submit}">Enviar codigo</button>
        </form>

        <p class="text-center mt-2"><a th:href="@{/auth/login}" th:text="#{forgot.back}">Volver a inicio de sesion</a></p>
    </div>
</div>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</body>
</html>
