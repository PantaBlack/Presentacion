# ============================================================
#  Configuracion de la aplicacion Viva Idiomas
# ============================================================

# Nombre de la aplicacion
spring.application.name=Viva Idiomas

# Puerto del servidor. Railway (y la mayoria de los hosts) asignan el puerto
# real via la variable de entorno PORT; en local, sin esa variable, usa 8080.
server.port=${PORT:8080}

# ------------------------------------------------------------
#  Base de datos H2 embebida (en memoria)
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:imfundodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2: APAGADA por defecto (una consola SQL sin autenticacion propia
# es una puerta trasera total: cualquiera podria ejecutar UPDATE users SET role='ADMIN').
# Para activarla en desarrollo local, ejecutar con el perfil dev:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
#  Cookie de sesion (JSESSIONID)
# ------------------------------------------------------------
# HttpOnly: ya lo pone Tomcat por defecto; se deja explicito por claridad.
# Secure: el navegador NUNCA la envia por HTTP plano. Correcto para un servidor
# real (siempre detras de HTTPS), pero rompe el login en local por HTTP simple:
# por eso application-dev.properties la vuelve a poner en false.
# SameSite=Lax: no viaja en peticiones de otros sitios (mitiga CSRF de cookie),
# pero si sigue funcionando al llegar por un enlace externo o una redireccion normal.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ------------------------------------------------------------
#  JPA / Hibernate
# ------------------------------------------------------------
# Sin "database-platform" fijo: Hibernate 6 detecta el dialecto correcto solo,
# a partir de la conexion real (H2 aqui en local, Postgres en el perfil "prod").
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Todas las relaciones @ManyToOne del modelo son EAGER, asi que no hay carga perezosa
# que dependa de una sesion abierta durante el render de la vista: se puede desactivar.
spring.jpa.open-in-view=false

# ------------------------------------------------------------
#  Subida de archivos (materiales educativos)
# ------------------------------------------------------------
# Los archivos se guardan en la base de datos (BLOB), no en disco: al ser H2
# en memoria, todo vive y se limpia junto con el resto de los datos.
spring.servlet.multipart.max-file-size=30MB
# El editor visual puede mandar varias imagenes (y ahora un video corto de fondo)
# en un solo guardado; el limite por archivo se mantiene igual, este cubre la suma
# de todos a la vez.
spring.servlet.multipart.max-request-size=90MB

# ------------------------------------------------------------
#  Thymeleaf
# ------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------
#  Internacionalizacion (i18n)
# ------------------------------------------------------------
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ------------------------------------------------------------
#  Pagina de error: nunca revela detalles internos (stack trace, mensaje de
#  la excepcion, errores de binding) a quien la ve. Ya es el default de
#  Spring Boot, pero se deja explicito para que nadie lo cambie sin darse
#  cuenta mas adelante y termine filtrando informacion en produccion.
# ------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ------------------------------------------------------------
#  Codificacion HTTP
# ------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ------------------------------------------------------------
#  Logging
# ------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.imfundokahle=INFO

# ------------------------------------------------------------
#  Datos de arranque (DataInitializer) - configurables por entorno
# ------------------------------------------------------------
# Credenciales del administrador inicial. La base de datos H2 es en memoria y se
# recrea en cada arranque (ver ddl-auto=create-drop), asi que este valor por defecto
# esta pensado solo para desarrollo local: cambialo con la variable de entorno
# ADMIN_PASSWORD antes de desplegar en cualquier sitio accesible por otras personas.
app.seed.admin-email=${ADMIN_EMAIL:admin@viva-idiomas.local}
app.seed.admin-password=${ADMIN_PASSWORD:CambiaEsteAdmin#2026}

# Contrasena compartida de las cuentas de demostracion (profesores/alumnos/practicantes
# de ejemplo). Se puede sobreescribir con la variable de entorno SEED_PASSWORD.
app.seed.demo-password=${SEED_PASSWORD:CambiaEsta#2026}

# Activa o desactiva la carga de los ~68 usuarios de demostracion.
app.seed.demo-users-enabled=${SEED_DEMO_USERS:true}

# ------------------------------------------------------------
#  Correo saliente (recuperacion de contrasena) via Gmail SMTP
# ------------------------------------------------------------
# MAIL_USERNAME: tu direccion de Gmail completa.
# MAIL_APP_PASSWORD: una "contrasena de aplicacion" generada en
# https://myaccount.google.com/apppasswords (requiere verificacion en dos pasos
# activada en esa cuenta). NUNCA la contrasena normal de la cuenta.
# Sin estas dos variables definidas, el envio de correo fallara: define ambas como
# variables de entorno antes de arrancar la app.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Remitente que vera el usuario en el correo recibido (por defecto, la misma cuenta de envio).
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@viva-idiomas.local}}

# ------------------------------------------------------------
#  Google reCAPTCHA v2 ("No soy un robot") - login, registro y recuperar contrasena
# ------------------------------------------------------------
# Claves de https://www.google.com/recaptcha/admin/create (elige reCAPTCHA v2 -> casilla
# "No soy un robot"). La site-key es publica (va en el HTML); la secret-key NUNCA se expone,
# solo el backend la usa para verificar contra la API de Google.
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
