<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/fragments :: head('Error')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-card text-center fade-in">
        <div class="auth-logo">&#127758;</div>
        <h2 th:text="${status} ?: 'Error'">Error</h2>
        <p class="text-muted" th:text="${error} ?: 'Ha ocurrido un error inesperado.'">Ha ocurrido un error.</p>
        <p class="text-muted" th:if="${message}" th:text="${message}"></p>
        <a class="btn btn-primary mt-2" th:href="@{/}" th:text="#{common.back}">Volver al inicio</a>
    </div>
</div>
</body>
</html>
