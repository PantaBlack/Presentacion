# ============================================================
#  Perfil "dev": SOLO para desarrollo local en tu propia maquina.
#  Actívalo con: mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  NUNCA actives este perfil en un servidor accesible desde internet.
# ============================================================

# Habilita la consola web de H2 en http://localhost:8080/h2-console
# (usuario: sa, contrasena: vacia, JDBC URL: jdbc:h2:mem:imfundodb)
spring.h2.console.enabled=true

# Facilita ver las consultas SQL generadas mientras se depura.
spring.jpa.show-sql=true

# La cookie de sesion "Secure" no viaja por HTTP plano: en localhost sin HTTPS
# el login se quedaria colgado. Solo se relaja aqui, en el perfil de solo-desarrollo.
server.servlet.session.cookie.secure=false
